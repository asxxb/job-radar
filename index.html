<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Radar</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#18202e;--mu:#5f6b7f;--bd:#d9dfea;--ac:#3b4cca;--new:#e58a00}
@media(prefers-color-scheme:dark){:root{--bg:#10141d;--card:#181e2b;--tx:#e6eaf3;--mu:#8e9ab0;--bd:#28314a;--ac:#8c9bff;--new:#ffb340}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--bd)}
h1{font-size:18px;margin:0 8px 0 0}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input{flex:1;min-width:160px}
main{max-width:980px;margin:0 auto;padding:16px 20px}
.job{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;justify-content:space-between}
.job.new{border-left:4px solid var(--new)}
.job h3{margin:0;font-size:16px}.job a{color:var(--tx);text-decoration:none}.job a:hover{color:var(--ac)}
.meta{color:var(--mu);font-size:13px}.desc{color:var(--mu);font-size:13px;margin-top:4px;max-width:70ch}
.act{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow-x:auto}
.col{background:color-mix(in srgb,var(--card) 60%,transparent);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:200px}
.col h2{font-size:14px;margin:2px 4px 8px;text-transform:capitalize}
.tcard{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px;margin-bottom:8px;font-size:13px}
.tcard select{width:100%;margin-top:6px;padding:3px}.note{color:var(--mu);margin-top:4px}
.empty{color:var(--mu);padding:30px;text-align:center}
@media(max-width:640px){.job{flex-direction:column}.act{flex-direction:row}}
</style>
</head>
<body>
<header>
  <h1>Job Radar</h1>
  <button id="tJobs" class="on">Jobs</button>
  <button id="tTrack">Tracker</button>
  <input id="q" type="search" placeholder="Filter by title, company, location">
  <select id="kind"><option value="">All</option><option value="remote">Remote</option><option value="local">On-site</option></select>
  <button id="notify">Enable alerts</button>
</header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
const STATUS = ['saved','applied','interview','offer','rejected'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let jobs = [], track = [], view = 'jobs';
const fresh = new Set();

async function api(path, method = 'GET', body) {
  const r = await fetch('/api/' + path, { method, headers: {'Content-Type':'application/json'}, body: body && JSON.stringify(body) });
  return r.status === 204 ? null : r.json();
}
async function load() { [jobs, track] = await Promise.all([api('jobs'), api('tracker')]); render(); }
async function setStatus(id, status) { await api('tracker', 'POST', { id, status }); load(); }
async function note(id) { const n = prompt('Notes'); if (n !== null) { await api('tracker', 'POST', { id, notes: n }); load(); } }
async function drop(id) { await api('tracker/' + id, 'DELETE'); load(); }
const ago = t => { const h = (Date.now() - t) / 36e5; return h < 1 ? Math.max(1, Math.round(h * 60)) + 'm ago' : h < 48 ? Math.round(h) + 'h ago' : Math.round(h / 24) + 'd ago'; };

function render() {
  $('#tJobs').classList.toggle('on', view === 'jobs');
  $('#tTrack').classList.toggle('on', view === 'track');
  $('#app').innerHTML = view === 'jobs' ? renderJobs() : renderBoard();
}
function renderJobs() {
  const q = $('#q').value.toLowerCase(), k = $('#kind').value, tracked = new Set(track.map(t => t.id));
  const list = jobs.filter(j => (!q || `${j.title} ${j.company} ${j.location}`.toLowerCase().includes(q)) && (!k || (k === 'remote') === !!j.remote));
  if (!list.length) return '<p class="empty">No jobs yet. The first poll can take a few seconds. Check your keywords in config.json.</p>';
  return list.slice(0, 200).map(j => `
    <article class="job ${fresh.has(j.id) ? 'new' : ''}">
      <div>
        <h3><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h3>
        <div class="meta">${esc(j.company)}, ${esc(j.location || 'n/a')}, ${j.remote ? 'remote' : 'on-site'}, found ${ago(j.found)} via ${esc(j.source)}</div>
        <div class="desc">${esc(j.desc)}</div>
      </div>
      <div class="act">${tracked.has(j.id) ? '<span class="meta">In tracker</span>' : `<button onclick="setStatus('${j.id}','saved')">Save</button><button onclick="setStatus('${j.id}','applied')">Mark applied</button>`}</div>
    </article>`).join('');
}
function renderBoard() {
  return `<div class="board">${STATUS.map(s => `
    <section class="col"><h2>${s} (${track.filter(t => t.status === s).length})</h2>
    ${track.filter(t => t.status === s).sort((a, b) => b.updated - a.updated).map(t => `
      <div class="tcard"><a href="${esc(t.url)}" target="_blank" rel="noopener"><b>${esc(t.title)}</b></a>
        <div class="meta">${esc(t.company)}</div>
        ${t.notes ? `<div class="note">${esc(t.notes)}</div>` : ''}
        <select onchange="setStatus('${t.id}',this.value)">${STATUS.map(x => `<option ${x === t.status ? 'selected' : ''}>${x}</option>`).join('')}</select>
        <div style="margin-top:6px;display:flex;gap:6px"><button onclick="note('${t.id}')">Notes</button><button onclick="drop('${t.id}')">Remove</button></div>
      </div>`).join('')}
    </section>`).join('')}</div>`;
}

$('#tJobs').onclick = () => { view = 'jobs'; render(); };
$('#tTrack').onclick = () => { view = 'track'; render(); };
$('#q').oninput = $('#kind').onchange = () => view === 'jobs' && render();
$('#notify').onclick = () => Notification.requestPermission().then(p => $('#notify').textContent = p === 'granted' ? 'Alerts on' : 'Alerts blocked');

new EventSource('/api/stream').onmessage = e => {
  const j = JSON.parse(e.data);
  jobs.unshift(j); fresh.add(j.id);
  if (Notification.permission === 'granted') new Notification(j.title, { body: j.company });
  render();
};
load();
</script>
</body>
</html>
